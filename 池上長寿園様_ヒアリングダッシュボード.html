<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>池上長寿園様 ヒアリングダッシュボード</title>
<style>
  :root{
    --navy:#d95c07; --navy-d:#a3450a; --accent:#f7701b;
    --ink:#4a3f33; --gray:#7b7166; --head:#3d372f;
    --line:#e8e2da; --bg:#f7f6f4; --card:#fff; --cream:#fff3e6; --cream2:#fff8f1;
    --green:#2e8b57; --green-bg:#e8f4ec; --gold:#a06a00; --gold-bg:#fdf3dc;
    --red:#c0392b; --red-bg:#fbeae8;
    --bar:#2563eb; --bar2:#9dbdf2; --track:#d7e5fa;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Noto Sans JP","Yu Gothic Medium","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;font-size:14px;overflow-x:hidden;}
  button,input,select,textarea{font-family:inherit;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px 50px;}
  .demo-chip{display:inline-block;background:var(--red-bg);color:var(--red);border:1px solid #f0c9c4;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 10px;margin-left:10px;vertical-align:1px;letter-spacing:.04em;}

  /* ヘッダー */
  header.top{background:#fff;padding:16px 0 14px;border-top:2px solid var(--accent);}
  .top .inner{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .top .en{font-size:10.5px;letter-spacing:.3em;color:var(--gray);font-weight:700;}
  .top h1{font-size:21px;line-height:1.4;color:var(--head);}
  .top .sub{font-size:12.5px;color:var(--gray);}
  .top .right{display:flex;gap:12px;align-items:center;}
  .login{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--gray);flex-wrap:wrap;}
  .login select{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--head);background:#fff;cursor:pointer;}
  .login .lh{font-size:11px;color:#b3a898;}
  .cd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 18px;text-align:center;}
  .cd .l{font-size:10.5px;color:var(--gray);}
  .cd .n{font-size:22px;font-weight:700;line-height:1.2;color:var(--head);}
  .cd .n small{font-size:12px;font-weight:500;color:var(--gray);}

  /* タブ */
  .tabs{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(120,80,40,.04);}
  .tabs .inner{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:thin;}
  .tab{flex:0 0 auto;border:0;background:none;padding:12px 14px 11px;font-size:14px;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .tab:hover{color:var(--head);}
  .tab.on{color:var(--head);border-bottom-color:var(--accent);}
  .tab .dot{width:9px;height:9px;border-radius:50%;background:#d9d3ca;flex:0 0 9px;}
  .tab .dot.done{background:var(--green);}
  .tab .dot.part{background:#e0a100;}
  .tab .cmn{font-size:10.5px;font-weight:700;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;line-height:1.6;min-width:18px;text-align:center;}
  .tabs .gap{flex:0 0 1px;background:var(--line);margin:10px 8px;}
  .tabs .grp{align-self:center;font-size:10.5px;color:#b3a898;padding:0 4px 0 2px;white-space:nowrap;}
  .legend2{display:flex;gap:14px;font-size:11.5px;color:var(--gray);margin-top:12px;flex-wrap:wrap;}
  .legend2 span{display:inline-flex;align-items:center;gap:5px;}
  .legend2 i{width:9px;height:9px;border-radius:50%;display:inline-block;background:#d9d3ca;}

  /* 共通パーツ */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px rgba(120,80,40,.06);}
  .btn{border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 3px 10px rgba(217,92,7,.28);}
  .btn:hover{background:#c2560a;}
  .btn.mid{font-size:14px;padding:11px 22px;}
  .btn.sm{font-size:13px;padding:8px 14px;border-radius:10px;}
  .btn.ghost{background:#fff;color:var(--head);border:1px solid var(--line);box-shadow:none;}
  .btn.ghost:hover{background:#faf8f5;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  h2.sec{font-size:16px;color:var(--head);margin:26px 0 10px;display:flex;align-items:center;gap:10px;}
  h2.sec::before{content:"";width:3px;height:17px;background:var(--accent);border-radius:2px;display:inline-block;}
  h2.sec .note{font-size:12px;color:var(--gray);font-weight:400;}
  .st{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 11px;white-space:nowrap;}
  .st.done{background:var(--green-bg);color:var(--green);}
  .st.part{background:var(--gold-bg);color:var(--gold);}
  .st.none{background:#f1efec;color:var(--gray);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card-h{padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;color:var(--head);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .card-h small{font-size:12px;color:var(--gray);font-weight:400;}
  .card-b{padding:12px 18px 16px;}

  /* 全体タブ */
  .kpis{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:14px;margin-top:22px;}
  .kpi{padding:14px 20px;}
  .kpi .l{font-size:12px;color:var(--gray);}
  .kpi .v{font-size:26px;font-weight:700;color:var(--head);line-height:1.25;}
  .kpi .v small{font-size:13px;color:var(--gray);font-weight:500;margin-left:3px;}
  .kpi .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;}
  .bar{height:12px;border-radius:999px;background:var(--track);margin-top:10px;overflow:hidden;display:flex;}
  .bar i{display:block;height:100%;}
  .points{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .pt{padding:14px 18px;}
  .pt .l{font-size:12px;color:var(--gray);}
  .pt b{display:block;font-size:17px;color:var(--head);line-height:1.4;margin-top:2px;}
  .pt span{font-size:12.5px;color:var(--gray);}
  .rank li{list-style:none;display:grid;grid-template-columns:130px 1fr 38px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px;}
  .rank .lb{color:var(--ink);line-height:1.35;}
  .rank .tr{height:10px;border-radius:999px;background:#eef3fb;overflow:hidden;}
  .rank .fi{display:block;height:100%;background:var(--bar2);border-radius:999px;}
  .rank li.top .fi{background:var(--bar);}
  .rank li.top .lb{font-weight:700;color:var(--head);}
  .rank .ct{text-align:right;font-weight:700;color:var(--head);}
  .design-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .ds{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;}
  .ds.top{border:2px solid var(--accent);background:var(--cream2);}
  .ds b{display:block;font-size:12.5px;color:var(--head);margin-top:6px;}
  .ds .v{font-size:18px;font-weight:700;color:var(--head);line-height:1.2;}
  .ds .v small{font-size:11px;color:var(--gray);font-weight:500;}
  .colors{display:flex;flex-wrap:wrap;gap:8px;}
  .cl{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;}
  .cl i{display:inline-flex;border-radius:5px;overflow:hidden;width:28px;height:18px;border:1px solid rgba(0,0,0,.08);}
  .cl i em{flex:1;}
  .cl b{color:var(--head);}
  .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px;}
  details.more{margin-top:16px;}
  details.more summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--head);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 2px;}
  details.more summary::-webkit-details-marker{display:none;}
  details.more summary::after{content:"＋";color:var(--navy);}
  details.more[open] summary::after{content:"－";}

  /* 施設タブ */
  .fhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;}
  .fhead h2{font-size:24px;color:var(--head);display:flex;align-items:center;gap:12px;}
  .fhead .meta{font-size:13px;color:var(--gray);margin-top:2px;}
  .two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:14px;align-items:start;}
  .ans{padding:4px 20px 10px;}
  .ans .who{font-size:12.5px;color:var(--gray);padding:12px 0 2px;border-bottom:1px dashed var(--line);}
  .ans .who b{color:var(--head);}
  .ans .row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #f3efea;align-items:start;}
  .ans .row:last-child{border-bottom:0;}
  .ans .k{font-size:12.5px;color:var(--gray);padding-top:4px;}
  .chipv{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13.5px;margin:2px 6px 2px 0;color:var(--head);}
  .chipv.main{background:var(--cream2);border-color:#f0dcc6;font-weight:700;}
  .chipv.none{color:#b5ada2;background:#fff;border-style:dashed;}
  .quote{background:#fbfaf8;border-left:3px solid #e8d9c6;border-radius:0 10px 10px 0;padding:8px 12px;font-size:14px;line-height:1.75;white-space:pre-wrap;color:var(--head);}
  .empty{padding:44px 20px;text-align:center;}
  .empty b{display:block;font-size:17px;color:var(--head);}
  .empty p{font-size:13.5px;color:var(--gray);margin:4px 0 16px;}

  /* チャット（コメント・返信） */
  .cm{padding:12px 16px 14px;}
  .chh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 2px 10px;border-bottom:1px solid var(--line);}
  .chh h3{font-size:15px;color:var(--head);}
  .chh h3 small{font-size:12px;color:var(--gray);font-weight:400;margin-left:6px;}
  .chh .hint{font-size:11.5px;color:#b3a898;}
  .newn{font-size:12px;font-weight:700;color:var(--red);background:var(--red-bg);border-radius:999px;padding:1px 10px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 13px;font-size:12.5px;color:var(--gray);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
  .chip:hover{color:var(--head);}
  .chip.on{background:var(--cream2);border-color:var(--accent);color:var(--head);}
  .chip b{min-width:18px;background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;padding:0 5px;line-height:1.6;text-align:center;}
  .chatwrap{position:relative;}
  .chat{position:relative;max-height:540px;overflow-y:auto;padding:0 4px 6px 0;}
  .day{display:flex;align-items:center;gap:10px;margin:12px 0 2px;font-size:11.5px;color:var(--gray);font-weight:700;}
  .day::before,.day::after{content:"";flex:1;height:1px;background:var(--line);}
  .day span{background:#f4f1ed;border-radius:999px;padding:1px 12px;}
  .thr{padding:6px 0 8px;border-bottom:1px solid #f3efea;}
  .thr:last-child{border-bottom:0;}
  .msg{display:flex;gap:10px;padding:6px 8px;border-radius:10px;}
  .msg.new{background:#fff6ec;}
  .msg .mb{min-width:0;flex:1;}
  .mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--gray);line-height:1.5;}
  .mh b{color:var(--head);font-size:13.5px;}
  .role{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--gray);background:#fff;line-height:1.5;}
  .role.you{border-color:#f0dcc6;color:var(--navy);}
  .nw{font-size:10px;font-weight:700;color:#fff;background:var(--red);border-radius:4px;padding:0 5px;letter-spacing:.04em;line-height:1.6;}
  .ctx{font-size:14.5px;color:var(--ink);margin-top:1px;white-space:pre-wrap;word-break:break-word;line-height:1.7;}
  .ctx.stampmsg{display:inline-block;background:var(--cream2);border:1px solid #f0dcc6;border-radius:999px;padding:1px 14px;font-size:13.5px;font-weight:700;color:var(--head);margin-top:3px;}
  .av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--cream);color:var(--navy);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .av.hq{background:var(--green-bg);color:var(--green);}
  .av.it{background:#eef3fb;color:#2459b8;font-size:11.5px;}
  .av.sm{flex:0 0 26px;width:26px;height:26px;font-size:11px;}
  .reps{margin:2px 0 0 44px;border-left:2px solid #efe9e1;padding-left:6px;}
  .more-re{border:0;background:none;color:#2459b8;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 8px;}
  .more-re:hover{text-decoration:underline;}
  .rp{border:0;background:none;color:var(--gray);font-size:12.5px;font-weight:700;cursor:pointer;margin:2px 0 0 50px;padding:3px 8px;border-radius:8px;}
  .rp:hover{background:var(--bg);color:var(--navy);}
  .rbox{margin:6px 0 2px 50px;padding:8px 10px 6px;background:var(--bg);border-radius:12px;}
  .rbox .cmf{margin-top:6px;}
  .lnk{border:0;background:none;color:var(--gray);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:4px;padding:0;}
  .tolatest{position:absolute;right:14px;bottom:10px;border:1px solid var(--line);background:#fff;color:var(--head);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12);}
  .tolatest[hidden]{display:none;}
  .nocm{color:var(--gray);font-size:13px;padding:18px 4px;}
  .ftag{border:0;cursor:pointer;font-size:11px;font-weight:700;background:#f1efec;color:var(--gray);border-radius:5px;padding:0 7px;line-height:1.7;font-family:inherit;}
  .ftag:hover{background:var(--cream);color:var(--navy);}
  .compose{border-top:1px solid var(--line);margin-top:4px;}
  .stamps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .stamp{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;color:var(--head);cursor:pointer;}
  .stamp:hover{background:var(--cream2);border-color:#f0dcc6;}
  .stamps.sm{margin-top:0;gap:5px;} .stamps.sm .stamp{font-size:12px;padding:2px 10px;}
  .cmf{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:8px;align-items:center;}
  .cmf input{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;color:var(--head);background:#fff;min-width:0;}
  .cmf input:focus{outline:2px solid #f3c9a3;border-color:var(--accent);}
  .tocm{display:none;}
  .cmlock{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--gray);}

  /* まとめタブ */
  .pl{padding:20px 24px 22px;margin-top:22px;}
  .pl .phd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .pl .phd h2{font-size:20px;color:var(--head);}
  .pl .phd p{font-size:13px;color:var(--gray);}
  .pl .meta{font-size:12px;color:var(--gray);text-align:right;margin-top:4px;}
  .pl .bar1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:12px;}
  .pl .bar1 label{font-size:12.5px;font-weight:700;color:var(--head);}
  .pl .bar1 input{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;color:var(--ink);background:#fff;}
  .pl .bar1 input[readonly]{background:#fbfaf8;border-color:#efe9e1;}
  .pl .banner{display:none;margin-top:14px;background:var(--green-bg);border:1px solid #bfe0cb;color:var(--green);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;}
  .pl.is-final .banner{display:block;}
  .pl.is-final .draft-only{display:none !important;}
  .pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
  .plf{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;background:#fff;}
  .plf .lb{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--head);}
  .plf .lb i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--cream);color:var(--navy);font-style:normal;font-size:12.5px;display:flex;align-items:center;justify-content:center;}
  .plf .ref{font-size:12px;color:#2459b8;background:#eef3fb;border-radius:8px;padding:5px 10px;margin-top:8px;line-height:1.55;}
  .plf textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.75;color:var(--ink);margin-top:8px;resize:vertical;background:#fff;overflow:hidden;}
  .plf textarea:focus{outline:2px solid #f3c9a3;border-color:var(--accent);}
  .plf textarea[readonly]{background:#fbfaf8;border-color:#efe9e1;color:var(--head);}
  .plf .pv{display:none;white-space:pre-wrap;font-size:12.5px;margin-top:6px;}
  .pl .actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .pl .actions .r{display:flex;gap:10px;flex-wrap:wrap;}
  .savedmsg{font-size:12.5px;color:var(--green);min-height:18px;}

  /* 見本（CSSで描いたミニ画面・写真・動き） */
  .mock{height:96px;border-radius:8px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.06);}
  .mock .h{height:16px;}
  .mock .mv{position:absolute;left:10px;right:10px;top:24px;height:38px;}
  .mock .t1,.mock .t2{position:absolute;left:10px;height:5px;border-radius:3px;}
  .mock .t1{top:70px;width:58%;} .mock .t2{top:80px;width:40%;}
  .mock.warm{background:#fff8ef;} .mock.warm .h{background:#f7a15a;border-radius:0 0 12px 12px;}
  .mock.warm .mv{background:#ffd9b3;border-radius:18px;} .mock.warm .t1,.mock.warm .t2{background:#e7b58a;}
  .mock.modern{background:#fff;} .mock.modern .h{background:#fff;border-bottom:1px solid #222;}
  .mock.modern .mv{background:#e9e9e9;border-radius:0;} .mock.modern .t1{background:#222;height:4px;} .mock.modern .t2{background:#bbb;height:4px;}
  .mock.trust{background:#f4f7fb;} .mock.trust .h{background:#0b3a78;}
  .mock.trust .mv{background:#c9d8ee;border-radius:3px;} .mock.trust .t1,.mock.trust .t2{background:#8aa4c8;}
  .mock.lively{background:#fffdf2;} .mock.lively .h{background:linear-gradient(90deg,#ff8a65,#ffd54f,#81c784,#64b5f6);}
  .mock.lively .mv{background:linear-gradient(90deg,#ffe0b2 0 33%,#c8e6c9 33% 66%,#bbdefb 66%);border-radius:10px;} .mock.lively .t1{background:#ff8a65;} .mock.lively .t2{background:#64b5f6;}
  .mock.none{background:repeating-linear-gradient(45deg,#faf8f5 0 8px,#f1ede8 8px 16px);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gray);font-weight:700;}
  .ds .mock{height:70px;} .ds .mock .mv{top:20px;height:26px;} .ds .mock .t1{top:52px;} .ds .mock .t2{top:60px;}
  .ph{height:96px;border-radius:8px;overflow:hidden;background:#f1ede8;position:relative;}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .ph.illust{background:#fff6ea;display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-bottom:12px;}
  .ph.illust i{display:block;border-radius:50% 50% 12px 12px;}
  .ph.illust i:nth-child(1){width:34px;height:52px;background:#f7a15a;}
  .ph.illust i:nth-child(2){width:40px;height:64px;background:#8cc9a0;}
  .ph.illust i:nth-child(3){width:30px;height:46px;background:#8fb6e8;}
  .mo{height:96px;border-radius:8px;background:#f7f6f4;position:relative;overflow:hidden;}
  .mo i{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--accent);top:35px;left:12px;}
  .mo.strong i{animation:mvStrong 1.6s ease-in-out infinite;}

function tally(qid, R){
  const c = {}; let n = 0;
  R.forEach(function(r){ const v = r[qid]; if(!has(v)) return; n++; (Array.isArray(v) ? v : [v]).forEach(function(x){ c[x] = (c[x] || 0) + 1; }); });
  const rows = Q[qid].opts.map(function(o){ return {v:o[0], t:sl(qid, o[0]), c:c[o[0]] || 0, o:o}; })
    .filter(function(x){ return x.c > 0; }).sort(function(a, b){ return b.c - a.c; });
  return {n:n, rows:rows};
}
function rankHtml(qid, R){
  const t = tally(qid, R), max = t.rows.length ? t.rows[0].c : 1;
  return '<ul class="rank">' + (t.rows.map(function(x){
    return '<li class="' + (x.c === max ? "top" : "") + '"><span class="lb">' + esc(x.t) + '</span><span class="tr"><span class="fi" style="width:' +
      (x.c / max * 100) + '%"></span></span><span class="ct">' + x.c + '</span></li>';
  }).join("") || '<li style="color:var(--gray)">まだ回答がありません</li>') + '</ul>';
}
function card(title, body, note){
  return '<div class="panel"><div class="card-h">' + esc(title) + (note ? '<small>' + esc(note) + '</small>' : "") + '</div><div class="card-b">' + body + '</div></div>';

function threadHtml(root, reps, tag, openAll){

      reps.slice(hide).map(function(r){ return msgHtml(r, root, false); }).join("") + '</div>';
  }

      h += '<div class="rbox" id="rbox"><div class="stamps sm">' + STAMPS.slice(0, 3).map(function(s){ return '<button class="stamp" data-stamp-re="' + esc(root.id) + '" data-v="' + esc(s) + '">' + esc(s) + '</button>'; }).join("") + '</div>' +

function chatHtml(list, tag, onlyNew){
  const reps = {};
  list.forEach(function(c){ if(c.re) (reps[c.re] = reps[c.re] || []).push(c); });
  let roots = list.filter(function(c){ return !c.re; });
  if(onlyNew) roots = roots.filter(function(r){ return isNew(r) || (reps[r.id] || []).some(isNew); });
  let h = "", day = "";
  roots.forEach(function(r){
    if(r.d !== day){ day = r.d; h += '<div class="day"><span>' + dayLabel(r.d) + '</span></div>'; }
    h += threadHtml(r, reps[r.id] || [], tag, onlyNew);
  });
  return h || '<div class="nocm">' + (onlyNew ? "新着はありません。" : "まだコメントはありません。ひとことどうぞ。") + '</div>';

function afterChat(){
  const pane = $("chat"); if(!pane) return;
  const s = chatScroll; chatScroll = null;
  if(s){
    pane.scrollTop = s.top || 0;

    if(el){
      const top = el.offsetTop, bot = top + el.offsetHeight;
      if(bot > pane.scrollTop + pane.clientHeight) pane.scrollTop = bot - pane.clientHeight + 12;
      else if(top < pane.scrollTop) pane.scrollTop = top - 12;
    }
  }else{
    /* 開いたときは、最初の新着へ（なければ最新＝いちばん下へ） */

    case "toLatest": { const p = $("chat"); if(p){ p.scrollTop = p.scrollHeight; toggleLatest(); } return; }
    case "cmSend": return post(t.getAttribute("data-th"), $("cmTx").value);
    case "copyRemind": return copyRemind();
    case "csvBtn": return downloadCsv();
    case "printQBtn": return printAs("print-q");
    case "plDraft":
      if(PLF.some(function(f){ return pl.f && has(pl.f[f.k]); }) && !window.confirm("入力済みの内容を、回答からの下書きで置き換えます。よろしいですか？")) return;
      pl.f = buildDraft(); savePL("下書きを作りました"); return renderSummary();
    case "plFinal":
      if(!has(pl.by)){ $("plBy").focus(); $("plSaved").style.color = "var(--red)"; $("plSaved").textContent = "記入者を入力してください"; return; }
      pl.status = "final"; return savePL("確定しました");
    case "plEdit": pl.status = "draft"; return savePL("修正できます");
    case "plPrint": return printAs("print-pl");
  }
});
document.addEventListener("input", function(e){
  const t = e.target;
  if(t.matches(".plf textarea")){ pl.f = pl.f || {}; pl.f[t.getAttribute("data-f")] = t.value; $("pv_" + t.getAttribute("data-f")).textContent = t.value || "（未記入）"; fitTA(t); savePL(); }
  else if(t.id === "plBy"){ pl.by = t.value; savePL(); }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && $("wz").classList.contains("on")) return closeWz();
  if(e.key === "Enter" && !e.isComposing && e.keyCode !== 229){
    if(e.target.id === "cmTx"){ e.preventDefault(); return post(e.target.getAttribute("data-th"), e.target.value); }
    if(e.target.id === "rin"){ e.preventDefault(); return sendReply(e.target.getAttribute("data-re"), e.target.value); }
  }
  if(e.key === "Escape" && e.target.id === "rin"){ replyTo = null; chatScroll = {top:paneTop()}; return renderView(); }
});
document.addEventListener("change", function(e){
  if(e.target.id === "meSel"){ me = e.target.value; lsSet(LS.me, me); replyTo = null; renderTabs(); renderView(); }
});
window.addEventListener("resize", fitAll);
window.addEventListener("hashchange", function(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h !== tab && (h === "全体" || h === "まとめ" || TARGETS.indexOf(h) >= 0)) setTab(h);
});

/* ---------- ツール ---------- */
function clearPrint(){ document.body.classList.remove("print-q", "print-pl"); }
function printAs(cls){ clearPrint(); document.body.classList.add(cls); window.print(); setTimeout(clearPrint, 800); }
window.addEventListener("afterprint", clearPrint);
function copyRemind(){
  const list = TARGETS.filter(function(d){ return statusOf(d) !== "done"; });
  const text = "【ホームページ リニューアル ヒアリングのお願い】\n回答期限：10月16日（金）／所要時間：約10分\n下記のページからご回答をお願いいたします。\n（ヒアリングページのURL）\n\n対象：" + list.join("、");
  const done = function(){ const m = $("copyMsg"); if(m) m.textContent = "✓ コピーしました"; };
  const fb = function(){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){} ta.remove(); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fb); else fb();
}
function downloadCsv(){
  const cols = ["dept","name","freq","q1","q2","q3","q4","q5","q6","q7","q8","q9","q10","q11","q12"];
  const cell = function(s){ return '"' + String(s).replace(/"/g, '""') + '"'; };
  const lines = [["回答日"].concat(cols.map(function(c){ return Q[c].no + " " + Q[c].s; })).map(cell).join(",")];
  allResponses().forEach(function(r){ lines.push([r.date || ""].concat(cols.map(function(c){ return display(c, r[c]); })).map(cell).join(",")); });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv"}));
  a.download = "ヒアリング回答一覧.csv"; document.body.appendChild(a); a.click(); a.remove();
}
function renderPrintQ(){
  const KIND = {text:"記述", area:"記述", single:"1つ選ぶ", multi:"いくつでも", visual:"見本から選ぶ", photo:"見本から選ぶ", motion:"見本から選ぶ", color:"いくつでも"};
  let h = '<div class="qlist"><div style="font-size:17px;font-weight:700;margin:6px 0 2px;">ホームページ リニューアル ヒアリング項目</div>' +
          '<div style="font-size:11px;color:#777;">株式会社インフォネット（制作パートナー：株式会社ITLINE）</div>';
  STEPS.forEach(function(st, i){
    h += '<div class="stp">ステップ' + (i + 1) + '　' + esc(st.ttl) + '</div>';
    st.qs.forEach(function(qid){
      const q = Q[qid];
      h += '<div class="q"><div class="no">' + esc(q.no) + '</div><div><span class="lb">' + esc(q.label) + '</span><span class="kind">' + KIND[q.type] + (q.must ? "・必須" : "") + '</span>' +
        (q.opts ? '<div class="ops">' + (qid === "dept" ? "お客様の施設・部署に合わせて設定" : q.opts.map(function(o){ return esc(o[1]); }).join("／")) + '</div>' : "") + '</div></div>';
    });
  });
  h += '<div class="stp">まとめ（プロジェクトリーダー記入）</div>' + PLF.map(function(f, i){ return '<div class="q"><div class="no">まとめ' + (i + 1) + '</div><div><span class="lb">' + esc(f.t) + '</span></div></div>'; }).join("");
  $("printQ").innerHTML = h + '</div>';
}

$("meSel").innerHTML = MEMBERS.map(function(m){ return '<option' + (m === me ? " selected" : "") + '>' + esc(m) + '</option>'; }).join("");
markSeen(tab);
renderPrintQ();
renderTabs();
renderView();
</script>
</body>
</html>
